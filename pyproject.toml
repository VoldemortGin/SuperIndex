[project]
name = "superindex"
version = "0.1.0"
description = "PageIndex question answering over Azure DI Markdown"
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Runtime dependencies of superindex / webapp / nav and the vendored PageIndex/
# (Markdown path only: no pypdfium2 / Pillow). Pinned to the tested versions;
# uv.lock pins everything else.
dependencies = [
    "litellm==1.97.0",
    "openai==2.54.0",
    "openai-agents==0.20.0",
    "mcp==2.2.0",
    "PyPDF2==3.0.1",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.2",
    "regex==2026.9.10",
    "requests==2.34.2",
    "sortedcontainers==2.4.0",
    "tiktoken==0.14.0",
    "urllib3==2.8.0",
    "colorama==0.4.6; sys_platform == 'win32'",
    "pywin32==311; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]
build = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.7",
]
# Vendored PageIndex installed editable, with its PDF stack, for the
# scripts/0x_* experiments and standalone webapp/server.py. Never in the bundle
# (scripts/superindex.py and the PyInstaller spec use PageIndex/ from the path).
pageindex = [
    "pageindex",
    "pypdfium2==5.13.0",
    "Pillow==12.3.0",
]

[tool.uv]
# Not an installable package: run the CLI via `uv run scripts/superindex.py`,
# which puts the repo root on sys.path; superindex/__init__.py then falls back
# to the vendored PageIndex/.
package = false
# `uv sync` / `uv run` install every dependency group (dev, pageindex, build);
# the bundle build opts out with --no-default-groups --group build.
default-groups = "all"

[tool.uv.sources]
pageindex = { path = "PageIndex", editable = true }

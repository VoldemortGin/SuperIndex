# SuperIndex 路由策略 —— 业务方唯一需要改的文件
# ============================================================================
#
# 这里放的是「**文档通常放在哪**」的业务知识，也就是原本只能写死在
# superindex/nav/route.py 里的东西。改这个文件不需要碰代码，也不需要重新建索引。
#
# 三条重要约定
# ------------
# 1. **空策略 = 内置默认行为。** 把这个文件清空（或删掉），路由行为与以前
#    完全一致。所有策略都是「加分项」，不是「开关」。
# 2. **配置只影响排序和提示，不设闸门。** 权重（weights）和业务域（scopes）
#    只是让模型更倾向于某些目录；只有 exclude 会真正把目录从候选里拿掉，
#    因为 _drafts / templates 这类目录被搜到永远不是好事。
# 3. **改完即生效。** 每次提问都会重新读这个文件，不用重启服务。
#    写错了不会静默失败 —— 错误会记到 results/logs/errors.jsonl，用
#    `uv run python scripts/07_logs.py --failed` 查看，路由自动退回默认行为。
#
# 换文件位置：设环境变量 SUPERINDEX_ROUTING_POLICY=/path/to/policy.yaml
#
# ============================================================================

version: 1

directories:

  # ── 排除：唯一会「真正过滤」的配置 ──────────────────────────────────────
  # 按**目录名整段**匹配（不是子串），所以 exclude: [draft] 不会误伤
  # drafting-guidelines/。要写更深的规则就带上 `/`，会按路径通配匹配。
  exclude:
    - _drafts
    - _archive
    - templates
    - .trash

  # ── 权重：命中即加分，并在提示词里标注 ──────────────────────────────────
  # pattern 支持子串（annual 命中 2024/annual）或通配（*/annual/*）。
  # weight 会累加：一个目录同时命中 annual 和 group 就得到两边的分。
  # label 只用于提示词标注，可以写目录名表达不出来的业务含义。
  #
  # weights:
  #   - annual                      # 简写：权重 1
  #   - { pattern: interim, weight: 2, label: 中期报告 }
  #   - { pattern: group,   weight: 3, label: 集团口径 }
  #   - { pattern: "*/audited/*", weight: 2, label: 已审计 }

  # ── 业务域：纯提示，告诉模型「问这类问题先看哪」 ────────────────────────
  #
  # scopes:
  #   - name: 财务数据
  #     dirs: [annual, interim, financial]
  #     note: 涉及 VONB / OPAT / 股息等指标时优先看这里
  #   - name: 监管披露
  #     dirs: [regulatory, solvency]
  #     note: 偿付能力、监管处罚相关问题

# ── 报告期识别 ────────────────────────────────────────────────────────────
# 内置已经能识别 4 位年份（19xx / 20xx），这里补业务写法。
# 捕获组是 2 位数字会补成 20xx（FY24 → 2024），同时原文也会作为匹配词。
#
# periods:
#   patterns:
#     - 'FY\s?(\d{2,4})'
#     - '(\d{4})\s*年'
#     - '(\d{4})\s*[Hh]1'
#     - '\bQ([1-4])\b'

# ── 别名：同义词扩展，回退匹配时生效 ──────────────────────────────────────
# 组内任意一个词出现在问题里，其余词就会被加进检索词。方向是对称的 ——
# 不用纠结哪个写法是「正名」。
#
# aliases:
#   中国平安: [平安, Ping An]
#   VONB: [新业务价值, value of new business]
#   寿险: [人身险, life insurance]

# ── 全局提示词补充 ────────────────────────────────────────────────────────
# 会原样追加到目录选择 / 文件选择的提示词里。用来写「软规则」，
# 例如口径优先级、同名文件的取舍。
#
# instructions: |
#   - 集团合并口径优先于子公司口径
#   - 同一年度同时存在「已审计」和「未审计」时，优先已审计

# ── 报告类型 ──────────────────────────────────────────────────────────────
# 建库时给每份文档定 report_type（存进 doc_meta），优先级：来源文件夹 > 文件名 > LLM。
#   folders : 来源文件夹名关键词（相对 PDF 根目录的任一级目录；大小写、_ - 多空格不敏感，
#             按词首匹配，所以 "country trend" 也命中 "Country Trends Encropyted"）
#   aliases : 缩写 / 全称：既用于文件名兜底，也用于识别「问题点名了这类报告」
#             （点名才只在这类里查，没点名不按类型过滤）
#   filename: 只用于文件名的额外关键词（太泛、不适合从问题里识别的词，如 Monthly）
#   split   : 文件夹定了大类后，再看文件名细分成哪一类（判断不了就记大类）
#   use     : 这类报告适合回答什么 —— 原样写进 agent 提示词，帮它自己判断该查哪类
#   quarter_as_half: true 时文件名里的 Q2 / Q4 记为 1H / FY（按半年出的报告，如 Factbook）；
#             其它类型的 Q2 / Q4 仍是季度（2022Q2 / 2022Q4）
# 改完后运行 `superindex doc-meta --no-llm --pdf-dir <PDF 目录>`（或 Notebook 步骤 2）
# 即可按新规则补全已有文档，不调 LLM、不重建库。
# 现有的 annual / interim（年报 / 中报）是内置类型，不用写在这里。
report_types:
  qmr:
    name: QMR（Quarterly Management Report，季度管理报告）
    folders: [qmr]
    aliases: [QMR, Quarterly Management Report]
    use: 季度实际经营数据、管理口径的业绩与指标
  mbr_qbr:
    name: MBR / QBR（月度 / 季度业务回顾，文件名无法区分时）
    folders: [mbr, qbr]
    split: [mbr, qbr]
    use: 月度 / 季度实际经营数据与业务回顾
  mbr:
    name: MBR（Monthly Business Review，月度业务回顾）
    aliases: [MBR, Monthly Business Review]
    filename: [Monthly]
    use: 月度实际经营数据与业务回顾
  qbr:
    name: QBR（Quarterly Business Review，季度业务回顾）
    aliases: [QBR, Quarterly Business Review]
    filename: [Quarterly Business]
    use: 季度实际经营数据与业务回顾
  factbook:
    name: Factbook（数据手册，大体按半年）
    folders: [factbook, fact book]
    aliases: [Factbook, Fact Book]
    use: 历史趋势、多期对比的数据（含往期数据）
    quarter_as_half: true
  exco_trend:
    name: EXCO Trend（Executive Committee 关键指标趋势，按国家/地区）
    folders: [country trend]
    aliases: [EXCO Trend, EXCO Trends, Country Trend, Country Trends]
    use: 各国家/地区关键指标的多期趋势与对比（含往期数据）
  go_exco_deck:
    name: GO EXCO Deck（Group Office EXCO 汇报材料）
    folders: [go exco, exco deck, exco deco]
    aliases: [GO EXCO, GO EXCO Deck, EXCO Deck, Group Office EXCO]
    use: 集团层面的汇报材料、集团整体表现与重点事项

# ── 单语料覆盖 ────────────────────────────────────────────────────────────
# 键写语料的**显示名**（左侧列表里看到的那个名字）或语料 ID。
# 覆盖项与全局**合并**，不是替换 —— 所以只写需要追加的部分即可。
#
# corpora:
#   友邦保险:
#     directories:
#       weights:
#         - { pattern: thailand, weight: 3, label: 泰国市场 }
#     instructions: |
#       - 该语料的年报按市场拆章，注意区分集团口径与单一市场口径
